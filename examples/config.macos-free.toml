# Spotify Free-compatible macOS profile: no Web API app, OAuth, or client ID.
# "current" follows the Connect target already selected in Spotify but cannot
# name or prove that target. Use "local_mac" only after selecting this Mac in
# Spotify when music and speech need to share the same output.

[station]
mode = "desktop"

[scheduler]
poll_seconds = 1.0
prepare_window_seconds = 75.0
boundary_lead_seconds = 1.0

[desktop]
local_device_name = ""
duck_percent = 35
fade_down_seconds = 0.8
fade_up_seconds = 1.0
voice_start_settle_seconds = 0.12
voice_timeout_margin_seconds = 10.0
intro_delay_seconds = 0.25
blackout_gap_seconds = 0.5

[spotify]
adapter = "macos_applescript"
device = "local_mac"
stability_seconds = 8.0
ad_wait_seconds = 120.0

[tts]
chinese = "macos"
english = "macos"

[tts.providers.macos]
type = "macos"

[recovery]
lines = [
  "The signal took the scenic route. The music will be right back.",
  "A brief pause while the station finds its footing.",
]

[improv]
enabled = false
liner_chance = 0.25
lines = [
  "The record took a turn of its own. Let's hear where it goes.",
  "That was not the door I reached for, but something came through it.",
  "It seems the machine wanted a song too.",
]

[android]
enabled = false
transport = "lan"
device = ""
mcp_url_env = "STATION_PHONE_MCP_URL"
mcp_token_env = "STATION_PHONE_MCP_TOKEN"
location_id = ""
path_prefix = ""
voice_start_timeout_seconds = 30.0
voice_finish_margin_seconds = 20.0
music_start_timeout_seconds = 30.0
